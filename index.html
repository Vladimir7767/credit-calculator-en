    <meta charset="UTF-8">

    <title>Online Credit Calculator — Calculate Monthly Payments & Interest</title>
    <meta name="description" content="Free and easy online loan calculator. Instantly calculate your monthly amortization payment, total interest overpayment, and total loan cost.">

                window.open(parts.join(''), '_blank');

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); max-width: 460px; width: 100%; }
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; color: #334155; }
        button { width: 100%; padding: 12px; background: #2ecc71; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #27ae60; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; text-align: left; font-size: 16px; line-height: 1.5; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .faq { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; font-size: 13px; color: #666; line-height: 1.5; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>Credit Calculator</h1>
    
    <div class="form-group">
        <label for="amount">Loan Amount ($):</label>
        <input type="number" id="amount" placeholder="e.g. 10000" value="10000" required>
    </div>
    
    <div class="form-group">
        <label for="months">Loan Term (months):</label>
        <input type="number" id="months" placeholder="e.g. 12" value="12" required>
    </div>

    <div class="form-group">
        <label for="rate">Interest Rate (Annual %):</label>
        <input type="number" id="rate" placeholder="e.g. 12" value="12" step="0.1" required>
    </div>
    
    <button onclick="calculateCredit()">Calculate Results</button>
    
    <div id="resultBox" class="result"></div>

    <div class="faq">
        <h3>How is it calculated?</h3>
        <p>This calculator computes standard annuity credit schemes (equal monthly payments). It instantly reveals your monthly financial obligation, total lifetime payout, and the interest overpayment amount.</p>
    </div>
</div>

<script>
function calculateCredit() {
    const amount = parseFloat(document.getElementById('amount').value);
    const months = parseInt(document.getElementById('months').value);
    const rate = parseFloat(document.getElementById('rate').value);
    const resultBox = document.getElementById('resultBox');

    if (isNaN(amount) || isNaN(months) || isNaN(rate) || amount <= 0 || months <= 0 || rate < 0) {
        alert('Please enter valid positive numbers!');
        return;
    }

    const monthlyRate = (rate / 100) / 12;
    let monthlyPayment = 0;

    if (monthlyRate === 0) {
        monthlyPayment = amount / months;
    } else {
        monthlyPayment = amount * (monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
    }

    const totalPayment = monthlyPayment * months;
    const overPayment = totalPayment - amount;

    resultBox.style.display = 'block';
    resultBox.innerHTML = `
        <strong>Monthly Payment:</strong> $${monthlyPayment.toFixed(2)}<br>
        <strong>Total Payments:</strong> $${totalPayment.toFixed(2)}<br>
        <strong>Total Interest Cost:</strong> $${overPayment.toFixed(2)}
    `;
}
</script>

</body>
</html>
